# The plugin verdict on a bundled part, from spec's first-party-plugin workflow (F3-R9, F5-R13).
name: plugin
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  plugin:
    uses: lemonfiber/spec/.github/workflows/first-party-plugin.yml@44ec6254b939d4c746bd4ea32048b0daf0edd871 # v1.0.110

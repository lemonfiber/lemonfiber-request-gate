# The plugin verdict on a bundled part, from spec's first-party-plugin workflow (F3-R9, F5-R13).
name: plugin
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  plugin:
    uses: lemonfiber/spec/.github/workflows/first-party-plugin.yml@a3a5049ee28c2261cc6728db8b48fdf1083b4eca # v1.0.119

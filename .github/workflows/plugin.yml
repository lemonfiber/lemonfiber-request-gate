# The plugin verdict on a bundled part, from spec's first-party-plugin workflow (F3-R9, F5-R13).
name: plugin
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  plugin:
    uses: lemonfiber/spec/.github/workflows/first-party-plugin.yml@240e7bd6f1cea7e41588cd0d1af0fdc2e9ca9785 # v1.0.118

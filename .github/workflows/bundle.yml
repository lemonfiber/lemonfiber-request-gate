# Ask the catalogue to move this plugin's pin in the default bundle once the train's
# `release/image-pin` merges, through spec's reusable `first-party-bundle` (OPS-R86).
name: bundle
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/first-party-bundle.yml@c5e71bae1a1e2a7c499fa85a4679501d041eafaf # v1.0.136
    with:
      pin: image
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}

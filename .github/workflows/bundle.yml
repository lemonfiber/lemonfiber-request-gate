# Ask the catalogue to move this plugin's pin in the default bundle once the train's
# `release/image-pin` merges, through spec's reusable `first-party-bundle` (OPS-R86).
name: bundle
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/first-party-bundle.yml@757e680b2ed8d9d8df1f92b730ceea14c3ff873f # v1.0.141
    with:
      pin: image
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}

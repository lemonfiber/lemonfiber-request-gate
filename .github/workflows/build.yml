# The crate and the image, checked on every change that reaches code: format,
# lints, tests, the toolchain the crate promises, its dependency policy, and an
# image build.
name: build
on:
  pull_request:
  merge_group:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether this change reaches code, for the jobs below that judge nothing else.
  # Each of them skips where it does not, and runs wherever this job did not
  # succeed, so an answer that could not be reached runs everything.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so the base is here to compare against, and no file
          # contents but the checkout's: the comparison reads trees.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          # A pull request's base, a merge group's, or on a push the commit
          # before it. Any other event has none, and the answer is then that
          # everything runs.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 scripts/the_code_a_change_touches.py "${BASE}"

  check:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      # The answer `what changed` gives, which decides whether these jobs and the
      # CodeQL analysis run. Proven here rather than there: that job is not
      # required, and a red one runs everything, so a broken answer would be paid
      # for and never seen.
      - name: What reaches code is told from what does not
        run: python3 scripts/the_code_a_change_touches.py --self-test

  # Every line outside the process entry point runs under a test, as in the core.
  coverage:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Coverage (100% of lines outside main.rs)
        run: cargo llvm-cov --locked --ignore-filename-regex 'src/main\.rs' --fail-under-lines 100

  msrv:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version the crate promises
        id: promised
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version is declared, so there is no promise to collect on"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95.0
        with:
          toolchain: ${{ steps.promised.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: The crate builds on the version it promises
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.promised.outputs.version }}
        run: cargo check --locked

  deny:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The image builds, runs locked down the way the stack runs it, and answers its own
  # health check. Nothing is pushed: a signed tag is the only thing that publishes.
  image:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t request-gate:check .
      - name: Runs read-only, non-root, with no capabilities, and answers its health
        run: |
          set -euo pipefail
          docker run -d --name request-gate-check --read-only --cap-drop ALL \
            --security-opt no-new-privileges request-gate:check
          for _ in $(seq 1 20); do
            if docker exec request-gate-check /request-gate health; then
              docker rm -f request-gate-check >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs request-gate-check
          echo "::error::the image did not answer its own health check"
          exit 1

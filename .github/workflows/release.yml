# Publish this service's image from a tag the release train cut, through
# spec's shared `rust-service-release` (ADR-0033 §3, §4). The service id is this
# repository's name without `lemonfiber-` (ADR-0033 §1).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  # One publish per tag, never cancelled: a half-published index is worse than
  # a second run that finds the tag already built.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lemonfiber/spec/.github/workflows/rust-service-release.yml@58d3ff792b2ba75ae67970c42fbe1bdc6d9bcff1 # v1.0.87
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}

# Publish this service's image from every commit on main and from each tag the
# release train cuts, through spec's shared `rust-service-release` (ADR-0033 §3, §4;
# OPS-R90). A commit on main that changes nothing but the pin in plugin.toml, its
# recordings, proofs.json and targets.toml publishes nothing; the shared workflow
# decides that. The service id is this repository's name without `lemonfiber-`
# (ADR-0033 §1).
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  # One publish per ref, never cancelled: a half-published index is worse than
  # a second run that finds the tag already built.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lemonfiber/spec/.github/workflows/rust-service-release.yml@cb2c0640a7d2a8e7bd309680c682f792f1fdcf62 # v1.0.126
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}

# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses this tree and
# reads the report its `coverage` job wrote. Automatic Analysis is off for this
# project: SonarCloud refuses a CI scan of a project that has it on.
sonar.projectKey=lemonfiber_lemonfiber-request-gate
sonar.organization=lemonfiber

# The crate, the workflows and the image. `scripts/` is left out: its one file is a
# copy of the spec's `shared/gates/no_open_codeql_alert.py`, analysed at its home.
sonar.sources=src,.github,Dockerfile
sonar.tests=src
# Rust declares tests inside the file they test, and nothing here can see where a
# file stops shipping, so a module's tests live beside it in `<name>/tests.rs` and
# that shape is what marks a file as test code. `src/fake.rs` is the upstream and
# configuration the tests stand the gate up against, compiled only under test.
sonar.test.inclusions=**/tests.rs,src/fake.rs
# Written by the `coverage` job in `sonar.yml`, the run that holds every line
# outside `main.rs` to 100%.
sonar.rust.lcov.reportPaths=lcov.info

# S8431 asks for an image to be named by its tag or by its digest, not both. Every
# image a Dockerfile here builds from is named as `tag@sha256:...` on purpose. The
# digest is what the build pulls, so it is immutable. The tag is how a reader and
# Dependabot tell which version that digest is: Dependabot proposes a version bump
# only for an image whose tag it can read, and it moves the tag and the digest
# together.
sonar.issue.ignore.multicriteria=imagepins
sonar.issue.ignore.multicriteria.imagepins.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.imagepins.resourceKey=**/Dockerfile*

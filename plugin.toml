schema_version = 1

[plugin]
id          = "request-gate"
name        = "Request gate"
version     = "0.17.0"
description = "Stands between Seerr and the curators and the media server, so Seerr holds none of their keys"
without_it  = "Seerr cannot reach the curators or the media server: requests are not sent, and members cannot sign in to Seerr"
upstream    = "https://github.com/lemonfiber/lemonfiber-request-gate"
license     = "Hippocratic-3.0"
forms       = ["library", "full"]

[[service]]
id            = "request-gate"
name          = "Request gate"
image         = "ghcr.io/lemonfiber/request-gate"
digest        = "sha256:8507324b15eacae28b45132e9105a9a8c1c08aa09e4196339442fd7c6b0fad15"
tag           = "main-c54926e9ff62"
listens       = 5057
health        = { kind = "container" }
criticality   = "important"
memory_mib    = 32
mem_limit_mib = 64
reaches       = "plex.tv"
asks_for      = "Where Plex is the media server, plex.tv's account read alone, through its egress service and never over a route of its own: whose a token Seerr presents is, once per token, when Seerr's owner is the operator's own Plex account, and a member's own Plex sign-in, passed on unchanged, when Seerr reaches plex.tv through the gate. Otherwise nothing beyond this machine. It answers only Seerr, and makes the calls Seerr's requests, scans and sign-ins need of each curator's adapter and the media server, over networks it shares with them alone."
posture       = "confined"
replaces      = "request-gate"
provides      = ["request.gate"]
contract      = 5058
speaks        = ["request.gate@1"]

[service.env]
LEMONFIBER_REQUEST_GATE_PLEX_TV_THROUGH = "http://request-gate-egress:3128"

[[service]]
id            = "request-gate-egress"
name          = "Request gate egress"
image         = "ghcr.io/lemonfiber/request-gate"
digest        = "sha256:8507324b15eacae28b45132e9105a9a8c1c08aa09e4196339442fd7c6b0fad15"
tag           = "main-c54926e9ff62"
args          = ["egress"]
listens       = 3128
health        = { kind = "container" }
criticality   = "optional"
memory_mib    = 16
mem_limit_mib = 32
reaches       = "plex.tv"
asks_for      = "A tunnel to plex.tv's port 443 for the request gate alone, through which the gate makes its one plex.tv call over its own TLS, so nothing here reads it. It holds no secret and no configuration, and refuses a tunnel to anywhere else."
posture       = "confined"
network       = { egress_for = "request-gate" }

[[proof]]
id      = "request-gate.names-itself"
service = "request-gate"
title   = "The gate's own program says which gate it is"
fixture = "recordings/request-gate/names-itself.json"
why     = """
The gate publishes no port and answers only Seerr, over a network it shares with
nobody else, so it is proved live by running its own program: the pinned image
prints its name and version and exits cleanly.
"""
run     = { args = ["version"] }
expect  = { exit = 0, stdout_starts_with = "request-gate " }

[[ask]]
service     = "request-gate"
capability  = "library.curate"
each        = true
media_types = ["tv", "movies"]

[[ask]]
service     = "request-gate"
capability  = "identity.source"
native      = ["jellyfin", "emby", "plex"]
media_types = ["tv", "movies"]

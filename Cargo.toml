[package]
name = "lemonfiber-request-gate"
version = "0.17.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-request-gate"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The request gate: the request service's one path to the *arrs and the media server"
publish = false

[[bin]]
name = "request-gate"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package]
name = "lemonfiber-request-gate"
version = "0.17.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-request-gate"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The request gate: the request service's one path to the *arrs and the media server"
publish = false

[[bin]]
name = "request-gate"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.23"
# The contract it speaks, the kit that serves it, and the formats of the files in its
# configuration directory, from the core at the commit the train releases this build with.
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "3d26c96e2267f1e8e539b5d1cfa5e03d54fe4001" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "3d26c96e2267f1e8e539b5d1cfa5e03d54fe4001" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "3d26c96e2267f1e8e539b5d1cfa5e03d54fe4001" }
lemonfiber-sidecar = { git = "https://github.com/lemonfiber/lemonfiber", rev = "3d26c96e2267f1e8e539b5d1cfa5e03d54fe4001" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
ring = "0.17"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

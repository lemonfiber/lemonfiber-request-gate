[package]
name = "lemonfiber-request-gate"
version = "0.17.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-request-gate"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The request gate: the request service's one path to the *arrs and the media server"
publish = false

[[bin]]
name = "request-gate"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.23"
# The formats the core writes into this service's configuration directory, from the
# core at the commit the train releases this build with.
lemonfiber-sidecar = { git = "https://github.com/lemonfiber/lemonfiber", rev = "6577d8c68dabd76373e12f03936be96634091d08" }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
ring = "0.17"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

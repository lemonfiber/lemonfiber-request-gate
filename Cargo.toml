[package]
name = "lemonfiber-request-gate"
version = "0.17.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-request-gate"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The request gate: the request service's one path to the *arrs and the media server"
publish = false

[[bin]]
name = "request-gate"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.23"
# The contract it speaks and the kit that serves it, from the core at the commit the
# train releases this build with.
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb15065c8ab9024fb7cd3eec4a0954fd748a2df8" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb15065c8ab9024fb7cd3eec4a0954fd748a2df8" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb15065c8ab9024fb7cd3eec4a0954fd748a2df8" }
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb15065c8ab9024fb7cd3eec4a0954fd748a2df8" }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
url = "2"

[dev-dependencies]
lemonfiber-pinned = { git = "https://github.com/lemonfiber/lemonfiber", rev = "eb15065c8ab9024fb7cd3eec4a0954fd748a2df8", features = ["test-support"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
